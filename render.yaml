services:
  - type: web
    name: freelancify
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data && python manage.py collectstatic --noinput"
    startCommand: "gunicorn freelancify.wsgi:application"

    envVars:
      - key: DEBUG
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_PUBLIC_KEY
        sync: false